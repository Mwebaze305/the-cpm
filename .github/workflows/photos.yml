name: Fetch photos from Wikimedia Commons
on:
  push:
    branches: [photo-tools]
    paths: [tools/photos/request.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python tools/photos/commons.py
      - run: |
          git config user.name "cpm-photos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A tools/photos assets/img/photos || true
          git diff --cached --quiet || git commit -m "Photos: fetch from Wikimedia Commons"
          git push
