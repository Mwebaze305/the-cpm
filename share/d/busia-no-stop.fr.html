<title>Des commerçants du Kenya et de l&#x27;Ouganda veulent une frontière « sans arrêt » à Busia · The Credence Letters</title>
<meta name="description" content="Lors d&#x27;un dialogue politique transfrontalier Kenya–Ouganda à Busia, des commerçants et des responsables ont proposé de passer du poste frontière à arrêt unique à un système sans arrêt : inspections au point d&#x27;origine, dédouanement numérique et fin des contrôles en double par les agences des deux pays. Une inspectrice ougandaise de l&#x27;agriculture a indiqué qu&#x27;environ 80 % des cargaisons sont aujourd&#x27;hui inspectées à la frontière.">
