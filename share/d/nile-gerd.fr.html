<title>L&#x27;Égypte et le Soudan rejettent l&#x27;exploitation unilatérale du barrage éthiopien sur le Nil · The Credence Letters</title>
<meta name="description" content="À l&#x27;issue du troisième cycle de leur mécanisme « 2+2 » réunissant les ministres des Affaires étrangères et de l&#x27;Irrigation au Caire le 2 novembre, l&#x27;Égypte et le Soudan ont déclaré que l&#x27;exploitation du barrage sans accord contraignant menace leur sécurité hydrique, ont réaffirmé leurs droits au titre de l&#x27;accord de 1959 sur les eaux du Nil et ont appelé l&#x27;Éthiopie à revenir aux négociations. L&#x27;Éthiopie n&#x27;était pas partie à l&#x27;accord de 1959, qu&#x27;elle considère comme nul ; elle a inauguré le barrage en septembre 2025.">
