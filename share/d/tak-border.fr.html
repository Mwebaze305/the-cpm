<title>La Thaïlande convoque l&#x27;attaché militaire birman alors que les combats débordent la frontière · The Credence Letters</title>
<meta name="description" content="Le 2 novembre, le chef des forces armées thaïlandaises a convoqué l&#x27;attaché militaire birman et appelé à la prudence le long de la frontière, et le Premier ministre Anutin Charnvirakul a déclaré que l&#x27;armée protégerait la souveraineté thaïlandaise. Des munitions tirées lors d&#x27;affrontements près de Myawaddy ont blessé une habitante de Mae Sot le 29 octobre, et le 31 octobre des bombes larguées de l&#x27;autre côté de la Salouen ont endommagé des bâtiments à Mae Hong Son, sans faire de blessés. Le commerce par les points de passage non officiels de Tak a été suspendu jusqu&#x27;au 5 novembre.">
