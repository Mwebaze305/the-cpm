<title>แหล่งสแกมเมอร์: สหรัฐฯ คว่ำบาตรเครือข่ายในกัมพูชา ขณะที่ชาวแอฟริกันยังกลับบ้านได้ยาก · The Credence Letters</title>
<meta name="description" content="สหรัฐอเมริกาประกาศคว่ำบาตรบุคคล 4 รายและนิติบุคคล 41 แห่งที่เชื่อมโยงกับ Prince Group ซึ่งมีฐานในกัมพูชาเมื่อวันที่ 5 พฤศจิกายน และสถานทูตสหรัฐฯ ในไนโรบีระบุว่าชาวเคนยาหลายร้อยคนได้รับการช่วยเหลือออกจากแหล่งสแกมเมอร์ในเอเชียตะวันออกเฉียงใต้ในปี 2026 สำนักข่าว AP รายงานว่าหลังการปราบปรามในกัมพูชา อดีตแรงงานจำนวนมากติดค้างอยู่โดยไม่มีหนังสือเดินทางหรือตั๋วกลับบ้าน และเอกอัครราชทูตยูกันดาประจำมาเลเซียได้ช่วยเหลือแล้วกว่า 1,000 คน ส่วนใหญ่เป็นชาวยูกันดา">
