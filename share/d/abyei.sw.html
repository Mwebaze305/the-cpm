<title>Abyei: mashambulizi ya kwanza ya droni yaua watu wasiopungua 30 katika eneo linalodaiwa na Sudan na Sudan Kusini · The Credence Letters</title>
<meta name="description" content="Mkuu wa operesheni za kulinda amani za UN, Jean-Pierre Lacroix, aliliambia Baraza la Usalama tarehe 5 Novemba kwamba mashambulizi ya droni ya tarehe 19 Oktoba yaliua watu wasiopungua 30 na kujeruhi takriban 59 huko Abyei, mashambulizi ya kwanza ya aina hiyo eneo hilo; mapigano ya tarehe 15 Septemba yaliua watu 124. Sudan na Sudan Kusini zilianza tena mazungumzo rasmi mwezi Agosti kupitia Utaratibu wao wa Pamoja wa Kisiasa na Usalama, utakaokutana Khartoum tarehe 8 hadi 10 Novemba.">
