<title>Ebola : la RD Congo dépasse 10 700 cas, une attaque à Beni interrompt la riposte · The Credence Letters</title>
<meta name="description" content="L&#x27;ECDC recensait 10 741 cas confirmés et 5 230 décès dans huit provinces de la RD Congo au 4 novembre, et deux nouveaux candidats vaccins doivent rejoindre l&#x27;essai Tumaini à Bunia. Dans le territoire de Beni, au Nord-Kivu, une attaque nocturne a tué au moins 30 civils et détruit un centre de santé, selon l&#x27;OCHA le 6 novembre ; des contacts de malades d&#x27;Ebola ont fui un centre d&#x27;observation et les équipes de riposte ont suspendu leurs activités.">
