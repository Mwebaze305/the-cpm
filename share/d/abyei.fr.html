<title>Abyei : de premières frappes de drones tuent au moins 30 personnes dans la zone revendiquée par le Soudan et le Soudan du Sud · The Credence Letters</title>
<meta name="description" content="Le chef des opérations de paix de l&#x27;ONU, Jean-Pierre Lacroix, a déclaré au Conseil de sécurité le 5 novembre que des frappes de drones le 19 octobre avaient tué au moins 30 personnes et blessé environ 59 à Abyei, les premières attaques de ce type dans la zone ; des affrontements le 15 septembre avaient fait 124 morts. Le Soudan et le Soudan du Sud ont repris en août des pourparlers formels au sein de leur Mécanisme politique et de sécurité conjoint, qui se réunit à Khartoum du 8 au 10 novembre.">
