<title>Abyei: first drone strikes kill at least 30 in the area claimed by Sudan and South Sudan · The Credence Letters</title>
<meta name="description" content="UN peacekeeping chief Jean-Pierre Lacroix told the Security Council on 5 November that drone strikes on 19 October killed at least 30 people and injured about 59 in Abyei, the first attacks of their kind there; clashes on 15 September had killed 124. Sudan and South Sudan resumed formal talks in August through their Joint Political and Security Mechanism, which meets next in Khartoum from 8 to 10 November.">
