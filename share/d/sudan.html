<title>Sudan: drone strikes hit power and fuel as aid reaches one in ten people in need · The Credence Letters</title>
<meta name="description" content="UN humanitarian coordinator Denise Brown said on 3 November that energy and fuel sources &quot;appear to be systematically targeted&quot;, and that dialysis stopped for 25 people at a hospital near Khartoum after strikes cut its power. UNHCR and IOM said on 6 November that agencies can assist only about one in ten people in need, and the $2.9 billion aid plan for 2026 is 47 per cent funded. UN envoy Pekka Haavisto said on 2 November that talks with the RSF on a transition to civilian rule are planned before Christmas.">
