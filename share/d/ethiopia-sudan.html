<title>Ethiopia and Sudan expel each other&#x27;s consular staff after a complaint to the UN and AU · The Credence Letters</title>
<meta name="description" content="Sudan&#x27;s government complained to the UN Security Council and the AU Peace and Security Council on 1 November that Ethiopia lets the RSF launch drones from its territory. On 4 November Ethiopia gave six staff of Sudan&#x27;s consulate in Assosa 48 hours to leave, Reuters reported, and Sudan then closed Ethiopia&#x27;s consulate in Gedaref. Ethiopia denies backing the RSF and accuses Sudan, Egypt and Eritrea of backing Tigrayan rebels; all deny the claims.">
