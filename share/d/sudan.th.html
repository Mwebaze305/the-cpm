<title>ซูดาน: โดรนโจมตีโรงไฟฟ้าและแหล่งเชื้อเพลิง ขณะที่ความช่วยเหลือเข้าถึงผู้ต้องการเพียงหนึ่งในสิบ · The Credence Letters</title>
<meta name="description" content="นางเดนิส บราวน์ ผู้ประสานงานด้านมนุษยธรรมของสหประชาชาติ กล่าวเมื่อวันที่ 3 พฤศจิกายนว่าแหล่งพลังงานและเชื้อเพลิง &quot;ดูเหมือนถูกโจมตีอย่างเป็นระบบ&quot; และโรงพยาบาลแห่งหนึ่งใกล้กรุงคาร์ทูมต้องหยุดการฟอกไตของผู้ป่วย 25 คนหลังไฟฟ้าดับจากการโจมตี UNHCR และ IOM ระบุเมื่อวันที่ 6 พฤศจิกายนว่าหน่วยงานช่วยเหลือได้เพียงราวหนึ่งในสิบของผู้ที่ต้องการ และแผนความช่วยเหลือปี 2026 มูลค่า 2,900 ล้านดอลลาร์ได้รับเงินทุนร้อยละ 47 นายเปกกา ฮาวิสโต ทูตพิเศษสหประชาชาติ กล่าวเมื่อวันที่ 2 พฤศจิกายนว่ามีแผนเจรจากับกองกำลัง RSF เรื่องการเปลี่ยนผ่านสู่การปกครองโดยพลเรือนก่อนคริสต์มาส">
