<title>Soudan : des frappes de drones visent l&#x27;électricité et le carburant, l&#x27;aide n&#x27;atteint qu&#x27;une personne sur dix · The Credence Letters</title>
<meta name="description" content="La coordonnatrice humanitaire de l&#x27;ONU, Denise Brown, a déclaré le 3 novembre que les sources d&#x27;énergie et de carburant « semblent systématiquement ciblées », et que la dialyse s&#x27;est arrêtée pour 25 personnes dans un hôpital près de Khartoum après des frappes qui l&#x27;ont privé d&#x27;électricité. Le HCR et l&#x27;OIM ont indiqué le 6 novembre que les agences ne peuvent aider qu&#x27;environ une personne sur dix dans le besoin, et le plan d&#x27;aide de 2,9 milliards de dollars pour 2026 est financé à 47 %. L&#x27;envoyé de l&#x27;ONU Pekka Haavisto a indiqué le 2 novembre que des pourparlers avec les FSR sur une transition vers un pouvoir civil sont prévus avant Noël.">
