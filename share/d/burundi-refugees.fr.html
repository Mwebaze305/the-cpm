<title>Burundi : l&#x27;aide alimentaire de 125 000 réfugiés pourrait s&#x27;arrêter en janvier · The Credence Letters</title>
<meta name="description" content="Le PAM a indiqué le 3 novembre que l&#x27;aide destinée à près de 125 000 réfugiés au Burundi, pour la plupart venus de RD Congo, pourrait s&#x27;arrêter en janvier 2027 faute de nouveaux financements. Les rations ne couvrent déjà que 45 % des besoins alimentaires minimaux ; le PAM a besoin de 40 millions de dollars pour maintenir l&#x27;aide et rétablir des rations complètes jusqu&#x27;en septembre 2027.">
