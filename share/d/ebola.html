<title>Ebola: DR Congo passes 10,700 cases as an attack in Beni halts response work · The Credence Letters</title>
<meta name="description" content="ECDC counted 10,741 confirmed cases and 5,230 deaths in eight provinces of DR Congo by 4 November, and two more vaccine candidates are to join the Tumaini trial in Bunia. In Beni territory, North Kivu, an overnight attack killed at least 30 civilians and destroyed a health centre, OCHA said on 6 November; contacts of Ebola patients fled an observation centre and response teams suspended operations.">
