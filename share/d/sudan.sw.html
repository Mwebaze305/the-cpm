<title>Sudan: droni zashambulia umeme na mafuta huku misaada ikiwafikia mtu mmoja kati ya kumi wanaohitaji · The Credence Letters</title>
<meta name="description" content="Mratibu wa misaada ya kibinadamu wa UN, Denise Brown, alisema tarehe 3 Novemba kwamba vyanzo vya nishati na mafuta &quot;vinaonekana kulengwa kwa utaratibu&quot;, na kwamba huduma ya kusafisha damu ilisimama kwa watu 25 katika hospitali karibu na Khartoum baada ya mashambulizi kukata umeme. UNHCR na IOM zilisema tarehe 6 Novemba kwamba mashirika yanaweza kumsaidia takriban mtu mmoja tu kati ya kumi wanaohitaji, na mpango wa misaada wa dola bilioni 2.9 wa 2026 umefadhiliwa kwa asilimia 47. Mjumbe wa UN Pekka Haavisto alisema tarehe 2 Novemba kwamba mazungumzo na RSF kuhusu mpito kuelekea utawala wa kiraia yamepangwa kabla ya Krismasi.">
