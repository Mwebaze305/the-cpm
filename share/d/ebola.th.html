<title>อีโบลา: คองโกมีผู้ป่วยเกิน 10,700 ราย ขณะที่การโจมตีในเบนีทำให้งานรับมือต้องหยุดชะงัก · The Credence Letters</title>
<meta name="description" content="ศูนย์ป้องกันและควบคุมโรคแห่งยุโรป (ECDC) นับผู้ป่วยยืนยันได้ 10,741 ราย และเสียชีวิต 5,230 รายใน 8 จังหวัดของคองโก ณ วันที่ 4 พฤศจิกายน และจะมีวัคซีนที่อยู่ระหว่างพัฒนาอีก 2 ชนิดเข้าร่วมการทดลอง Tumaini ที่เมืองบูเนีย ในเขตเบนี จังหวัดคิวูเหนือ การโจมตีในเวลากลางคืนทำให้พลเรือนเสียชีวิตอย่างน้อย 30 คน และศูนย์สุขภาพถูกทำลาย ตามรายงานของ OCHA เมื่อวันที่ 6 พฤศจิกายน ผู้สัมผัสผู้ป่วยอีโบลาหนีออกจากศูนย์เฝ้าสังเกตอาการ และทีมรับมือต้องระงับการปฏิบัติงาน">
