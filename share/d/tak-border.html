<title>Thailand summons Myanmar&#x27;s military attaché as fighting spills across the border · The Credence Letters</title>
<meta name="description" content="On 2 November, Thailand&#x27;s armed forces chief summoned Myanmar&#x27;s military attaché and urged caution along the border, and Prime Minister Anutin Charnvirakul said the army would protect Thai sovereignty. Ammunition from clashes near Myawaddy injured a Mae Sot resident on 29 October, and on 31 October bombs dropped across the Salween damaged buildings in Mae Hong Son, with no one hurt. Trade through unofficial crossings in Tak was suspended until 5 November.">
