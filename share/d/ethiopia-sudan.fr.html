<meta name="description" content="Le gouvernement soudanais s&#x27;est plaint le 1er novembre auprès du Conseil de sécurité de l&#x27;ONU et du Conseil de paix et de sécurité de l&#x27;UA que l&#x27;Éthiopie laisse les FSR lancer des drones depuis son territoire. Le 4 novembre, l&#x27;Éthiopie a donné 48 heures à six agents du consulat soudanais d&#x27;Assosa pour partir, selon Reuters, puis le Soudan a fermé le consulat éthiopien de Gedaref. L&#x27;Éthiopie nie soutenir les FSR et accuse le Soudan, l&#x27;Égypte et l&#x27;Érythrée de soutenir des rebelles tigréens ; tous démentent.">
