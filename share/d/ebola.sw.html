<meta name="description" content="ECDC ilihesabu wagonjwa 10,741 waliothibitishwa na vifo 5,230 katika majimbo manane ya DR Kongo kufikia tarehe 4 Novemba, na chanjo mbili zaidi za majaribio zitajiunga na jaribio la Tumaini huko Bunia. Katika eneo la Beni, Kivu Kaskazini, shambulio la usiku liliua raia wasiopungua 30 na kuharibu kituo cha afya, OCHA ilisema tarehe 6 Novemba; watu waliokutana na wagonjwa wa Ebola walikimbia kituo cha uangalizi na timu za kukabiliana zilisimamisha kazi.">
