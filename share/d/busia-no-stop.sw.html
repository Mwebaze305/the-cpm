<meta name="description" content="Katika mazungumzo ya sera ya mipakani kati ya Kenya na Uganda mjini Busia, wafanyabiashara na maafisa walipendekeza kuhama kutoka kituo cha pamoja cha mpakani hadi mfumo usio na kusimama: ukaguzi mahali bidhaa zinapotoka, uondoaji wa kidijitali na kukomesha ukaguzi unaorudiwa na mashirika ya nchi hizo mbili. Mkaguzi wa kilimo wa Uganda alisema takriban asilimia 80 ya mizigo kwa sasa inakaguliwa mpakani.">
